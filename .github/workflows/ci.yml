name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://healthuser:pw@localhost:5432/healthassistant
      SYNC_DATABASE_URL: postgresql+psycopg2://healthuser:pw@localhost:5432/healthassistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  lint-and-security:
    name: Lint and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff vulture mypy bandit
      - name: ruff
        continue-on-error: true
        run: ruff check . --output-format=github
      - name: vulture
        continue-on-error: true
        run: vulture . --min-confidence 80
      - name: mypy
        continue-on-error: true
        run: mypy . --ignore-missing-imports
      - name: bandit
        run: bandit -r . -ll
